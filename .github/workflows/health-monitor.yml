name: Health Monitor

# WHY THIS EXISTS: on 2026-08-28 a transient Supabase connectivity blip crashed
# the dent-brain container. `railway.json` had restartPolicyType=ON_FAILURE with
# maxRetries=10, so Railway burned all 10 restarts in under two minutes, gave up,
# and left the deployment CRASHED for 4h45m. Nothing alerted; a teammate reported
# it. The failure is silent by construction — Railway's edge keeps terminating TLS,
# so /health hangs with zero bytes rather than returning an error status.
#
# Two-layer fix. Layer 1 is railway.json restartPolicyType=ALWAYS, which restarts
# on container exit indefinitely and should absorb transient blips on its own.
# Layer 2 is this workflow: independent outside-in detection, because a policy that
# fails to fire is exactly the thing that needs watching from outside.
#
# On confirmed-down it attempts ONE redeploy, rate-limited (see below), then fails
# the job so GitHub emails the failure notification.
#
# REQUIRED SECRET: RAILWAY_TOKEN — same project token the deploy workflow uses.

on:
  schedule:
    - cron: '*/5 * * * *'  # best-effort; GitHub often runs scheduled jobs 5-15 min late
  workflow_dispatch: {}

# Never pile up. If a check is still running when the next fires, drop the older one.
concurrency:
  group: health-monitor
  cancel-in-progress: true

permissions:
  contents: read

env:
  HEALTH_URL: https://dent-brain.dentthefuture.com/health
  RAILWAY_PROJECT: e371b833-75e2-4804-8645-efeb3f4c584a
  RAILWAY_SERVICE: dent-brain
  RAILWAY_ENV: production
  # Do not auto-redeploy if a deployment was created within this window. Stops a
  # sustained outage (e.g. the database is down for hours, which a redeploy cannot
  # fix) from triggering a rebuild every 5 minutes forever.
  REDEPLOY_COOLDOWN_MINUTES: '30'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /health
        id: probe
        run: |
          # Three attempts, 20s apart. A single failed curl is not an outage —
          # requiring consecutive failures keeps a one-off blip from paging anyone.
          for i in 1 2 3; do
            BODY="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -q '"status":"ok"' \
               && printf '%s' "$BODY" | grep -q '"db":"ok"'; then
              echo "attempt $i: healthy -> $BODY"
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $i: unhealthy -> ${BODY:-<no response>}"
            [ "$i" -lt 3 ] && sleep 20
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          echo "last_body=${BODY:-<no response>}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        if: steps.probe.outputs.healthy == 'false'

      - name: Install Railway CLI
        if: steps.probe.outputs.healthy == 'false'
        run: npm install -g @railway/cli

      - name: Decide whether a redeploy is safe
        id: decide
        if: steps.probe.outputs.healthy == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Fail SAFE: if we cannot read Railway state, alert without redeploying.
          # A redeploy loop is worse than a missed auto-recovery.
          if ! STATUS_JSON="$(railway status -p "$RAILWAY_PROJECT" -e "$RAILWAY_ENV" --json 2>/dev/null)"; then
            echo "could not read Railway status — alerting only"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DEPLOY_STATUS="$(printf '%s' "$STATUS_JSON" | jq -r '
            [.. | objects | select(has("latestDeployment")) | .latestDeployment.status] | first // "UNKNOWN"')"
          CREATED_AT="$(printf '%s' "$STATUS_JSON" | jq -r '
            [.. | objects | select(has("latestDeployment")) | .latestDeployment.createdAt] | first // empty')"
          echo "deployment status: $DEPLOY_STATUS (created $CREATED_AT)"
          echo "deploy_status=$DEPLOY_STATUS" >> "$GITHUB_OUTPUT"

          # Only a CRASHED deployment is the shape a redeploy actually fixes.
          # BUILDING/DEPLOYING means one is already in flight; leave it alone.
          if [ "$DEPLOY_STATUS" != "CRASHED" ]; then
            echo "not CRASHED — a redeploy would not help; alerting only"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$CREATED_AT" ]; then
            AGE_MIN=$(( ( $(date -u +%s) - $(date -u -d "$CREATED_AT" +%s) ) / 60 ))
            echo "last deployment is ${AGE_MIN}m old"
            if [ "$AGE_MIN" -lt "$REDEPLOY_COOLDOWN_MINUTES" ]; then
              echo "within ${REDEPLOY_COOLDOWN_MINUTES}m cooldown — not redeploying again"
              echo "redeploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "redeploy=true" >> "$GITHUB_OUTPUT"

      - name: Auto-redeploy
        if: steps.decide.outputs.redeploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach --service "$RAILWAY_SERVICE"

      - name: Wait for recovery
        id: recover
        if: steps.decide.outputs.redeploy == 'true'
        run: |
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -q '"status":"ok"'; then
              echo "recovered after redeploy: $BODY"
              echo "recovered=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "recovered=false" >> "$GITHUB_OUTPUT"

      - name: Report
        if: steps.probe.outputs.healthy == 'false'
        run: |
          echo "::error::dent-brain /health is DOWN. Last response: '${{ steps.probe.outputs.last_body }}'. Railway deployment status: '${{ steps.decide.outputs.deploy_status }}'. Auto-redeploy attempted: ${{ steps.decide.outputs.redeploy }}. Recovered: ${{ steps.recover.outputs.recovered || 'n/a' }}."
          # Fail the run in every down case, including one we auto-recovered —
          # "prod went down and healed itself" is still something you want to hear about.
          exit 1
